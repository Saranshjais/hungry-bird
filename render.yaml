{
  "services": [
    {
      "type": "web",
      "name": "hungry-bird-api",
      "runtime": "python",
      "rootDir": "backend",
      "buildCommand": "pip install -r requirements.txt && flask db upgrade",
      "startCommand": "gunicorn -w 1 --threads 16 --timeout 60 run:app",
      "envVars": [
        {
          "key": "APP_ENV",
          "value": "production"
        },
        {
          "key": "SECRET_KEY",
          "generateValue": true
        },
        {
          "key": "DATABASE_URL",
          "sync": false
        },
        {
          "key": "GOOGLE_MAPS_API_KEY",
          "sync": false
        },
        {
          "key": "PYTHON_VERSION",
          "value": "3.11.0"
        },
        {
          "key": "FLASK_APP",
          "value": "run.py"
        },
        {
          "key": "FRONTEND_URL",
          "sync": false
        },
        {
          "key": "CORS_ORIGINS",
          "sync": false
        },
        {
          "key": "RATELIMIT_STORAGE_URI",
          "value": "memory://"
        },
        {
          "key": "ADMIN_USERNAME",
          "sync": false
        },
        {
          "key": "ADMIN_EMAIL",
          "sync": false
        },
        {
          "key": "ADMIN_PASSWORD",
          "sync": false
        },
        {
          "key": "SMTP_HOST",
          "sync": false
        },
        {
          "key": "SMTP_PORT",
          "sync": false
        },
        {
          "key": "SMTP_USERNAME",
          "sync": false
        },
        {
          "key": "SMTP_PASSWORD",
          "sync": false
        },
        {
          "key": "SMTP_FROM",
          "sync": false
        },
        {
          "key": "SMTP_SECURITY",
          "value": "starttls"
        },
        {
          "key": "RAZORPAY_KEY_ID",
          "sync": false
        },
        {
          "key": "RAZORPAY_KEY_SECRET",
          "sync": false
        },
        {
          "key": "RAZORPAY_WEBHOOK_SECRET",
          "sync": false
        }
      ]
    }
  ]
}
