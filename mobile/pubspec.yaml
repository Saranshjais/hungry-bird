name: hungry_bird_app
description: "HungryBird - discover street food stalls and hidden gems near you."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  cached_network_image: ^4.0.4
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  http: ^1.6.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  package_info_plus: ^10.2.2
  provider: ^6.1.5+1
  razorpay_flutter: ^1.4.7
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  shimmer: ^4.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#F97316"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/icon.png"
    background_color: "#F97316"
    theme_color: "#F97316"

# `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash_logo.png
  color_dark: "#0C0A09"
  image_dark: assets/branding/splash_logo.png
  android_12:
    image: assets/branding/splash_mark.png
    color: "#FFFFFF"
    image_dark: assets/branding/splash_mark.png
    color_dark: "#0C0A09"
  web: false
